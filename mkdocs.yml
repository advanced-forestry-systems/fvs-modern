site_name: fvs-modern
site_description: User guide and technical reference for fvs-modern, a modernized fork of the USDA Forest Vegetation Simulator with Bayesian calibration.
site_author: Aaron Weiskittel, University of Maine
site_url: https://advanced-forestry-systems.github.io/fvs-modern/
repo_url: https://github.com/advanced-forestry-systems/fvs-modern
repo_name: advanced-forestry-systems/fvs-modern
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User guide:
      - Running projections: user-guide/running-projections.md
      - Stand inputs: user-guide/stand-inputs.md
      - Outputs: user-guide/outputs.md
      - Choosing a configuration: user-guide/choosing-a-configuration.md
      - Variants: user-guide/variants.md
      - Uncertainty: user-guide/uncertainty.md
      - Other interfaces: user-guide/other-interfaces.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Technical reference:
      - Architecture: reference/architecture.md
      - Building the engine: reference/building-the-engine.md
      - Configuration files: reference/configuration-files.md
      - Mortality models: reference/mortality-models.md
      - Calibration pipeline: reference/calibration-pipeline.md
      - Validation:
          - Catalog and gates: reference/validation.md
          - Model run-off (October 2026): reference/runoff.md
      - Testing and CI: reference/testing-and-ci.md
      - Release process: reference/release-process.md
